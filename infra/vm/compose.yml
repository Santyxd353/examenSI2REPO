name: vestidor18

services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vestidor18
      POSTGRES_USER: vestidor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestidor -d vestidor18"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.azure
    image: vestidor18-app:local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3018
      DATABASE_URL: postgresql://vestidor:${POSTGRES_PASSWORD}@database:5432/vestidor18
      PLATFORM_DATABASE_URL: postgresql://vestidor:${POSTGRES_PASSWORD}@database:5432/vestidor18
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      WEB_ORIGIN: https://${PUBLIC_HOST:?Configura PUBLIC_HOST}
      SERVE_WEB: "true"
      WEB_ROOT: /app/dist/web
      TRUST_PROXY: "1"
      STORAGE_ROOT: /data/storage
      PYTHON_PATH: /opt/venv/bin/python
      ANALYTICS_PYTHON_PATH: /opt/analytics-venv/bin/python
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      POSE_MODEL_PATH: /opt/models/pose_landmarker.task
      BLENDER_PATH: /usr/bin/blender
      RUN_DB_SEED: "${RUN_DB_SEED:-false}"
      OFFLINE_MASTER_KEY: ${OFFLINE_MASTER_KEY:?Configura OFFLINE_MASTER_KEY}
      OFFLINE_WRAP_KEYS: ${OFFLINE_WRAP_KEYS:-}
      OFFLINE_WRAP_KEY_VERSION: ${OFFLINE_WRAP_KEY_VERSION:-1}
      PLATFORM_OPERATOR_USERNAME: ${PLATFORM_OPERATOR_USERNAME:?Configura PLATFORM_OPERATOR_USERNAME}
      PLATFORM_OPERATOR_PASSWORD_HASH: ${PLATFORM_OPERATOR_PASSWORD_HASH:?Configura PLATFORM_OPERATOR_PASSWORD_HASH}
      PLATFORM_OPERATOR_JWT_SECRET: ${PLATFORM_OPERATOR_JWT_SECRET:?Configura PLATFORM_OPERATOR_JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      REPORT_AI_OPENAI_KEY: ${REPORT_AI_OPENAI_KEY:-}
      REPORT_AI_TEXT_MODEL: ${REPORT_AI_TEXT_MODEL:-}
      REPORT_AI_VOICE_MODEL: ${REPORT_AI_VOICE_MODEL:-gpt-transcribe}
      REPORT_AI_PROVIDER: ${REPORT_AI_PROVIDER:-openai}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_REPORTS_MODEL: ${GROQ_REPORTS_MODEL:-openai/gpt-oss-20b}
      GROQ_VOICE_MODEL: ${GROQ_VOICE_MODEL:-whisper-large-v3-turbo}
    volumes:
      - application-data:/data
      # Persist private ML artifacts in the existing data volume as well.
      - application-data:/app/.local
    networks:
      - internal

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Configura PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../.local/android-downloads:/srv/android-downloads:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  application-data:
  caddy-data:
  caddy-config:
