<text x="35" y="974.86" font-family="Arial" font-size="23" font-weight="bold" fill="#111111">Mensajes de la colaboración</text>
<text x="35" y="1014.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">1. Solicitar horizonte, variante, canal y ámbito</text>
