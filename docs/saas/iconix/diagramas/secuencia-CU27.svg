<text x="35" y="1158.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">5. Calcular reposición explicable con stock autorizado</text>
<text x="35" y="1194.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">6. Devolver datos y limitaciones</text>
<text x="35" y="1230.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">7. Revisar sugerencia o descargar resultado</text>
<text x="35" y="1266.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">8. Guardar revisión sin ejecutar transferencia</text>
<text x="35" y="1302.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">9. Registrar estado revisado o borrador</text>
<text x="35" y="1338.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">10. Entregar copia acotada y marcada</text>
