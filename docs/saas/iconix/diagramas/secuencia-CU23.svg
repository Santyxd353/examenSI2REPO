<text x="363.04999999999995" y="857.22" font-family="Arial" font-size="21" font-weight="normal" fill="#111111">10. Registrar</text>
<text x="35" y="945.86" font-family="Arial" font-size="23" font-weight="bold" fill="#111111">Mensajes de la colaboración</text>
<text x="35" y="985.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">1. Solicitar sincronización y revisar identidad</text>
<text x="35" y="1021.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">2. Reautenticar y enviar lote dependiente</text>
<text x="35" y="1057.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">3. Leer intención inmutable y hash</text>
<text x="35" y="1093.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">4. Buscar UUID, identidad y contenido previo</text>
<text x="35" y="1129.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">5. Confirmar cambio y resultado en la misma transacción</text>
<text x="35" y="1165.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">6. Conservar versiones y motivo cuando no aplica</text>
<text x="35" y="1201.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">7. Persistir comprobante y estado individual</text>
<text x="35" y="1237.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">8. Presentar confirmados, conflictos y bloqueados</text>
<text x="35" y="1273.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">9. Resolver conflicto con otra intención o descarte explícito</text>
<text x="35" y="1309.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">10. Registrar conciliación vinculada al original</text>
