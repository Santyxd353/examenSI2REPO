<text x="162.6" y="915.22" font-family="Arial" font-size="21" font-weight="normal" fill="#111111">10. Mostrar</text>
<text x="35" y="1003.86" font-family="Arial" font-size="23" font-weight="bold" fill="#111111">Mensajes de la colaboración</text>
<text x="35" y="1043.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">1. Configurar demostración y protocolo</text>
<text x="35" y="1079.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">2. Validar plan, fuente y configuración</text>
<text x="35" y="1115.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">3. Generar, validar y firmar manifest</text>
<text x="35" y="1151.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">4. Separar temporalmente y construir features pasadas</text>
<text x="35" y="1187.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">5. Ajustar pipeline y comparar baseline en validación</text>
<text x="35" y="1223.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">6. Congelar configuración y reajustar sin prueba</text>
<text x="35" y="1259.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">7. Evaluar horizontes y registrar métricas reales</text>
<text x="35" y="1295.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">8. Guardar versión, hash y estado</text>
<text x="35" y="1331.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">9. Entregar ficha marcada y limitaciones</text>
<text x="35" y="1367.04" font-family="Arial" font-size="22" font-weight="normal" fill="#111111">10. Mostrar evaluación reproducible sin afirmar exactitud real</text>
